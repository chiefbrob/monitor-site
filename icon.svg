<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Baby Monitor">

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BAAF0"/>
      <stop offset=".55" stop-color="#2A86D9"/>
      <stop offset="1" stop-color="#1A66B4"/>
    </linearGradient>
    <radialGradient id="halo" cx="40%" cy="28%" r="82%">
      <stop offset="0" stop-color="#FFF6C4"/>
      <stop offset=".34" stop-color="#FFDC7C"/>
      <stop offset=".70" stop-color="#F9B348"/>
      <stop offset="1" stop-color="#EE9028"/>
    </radialGradient>
    <linearGradient id="skin" x1=".26" y1="0" x2=".74" y2="1">
      <stop offset="0" stop-color="#6E4830"/>
      <stop offset=".40" stop-color="#4A2818"/>
      <stop offset="1" stop-color="#27130A"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C341B"/>
      <stop offset="1" stop-color="#2A1509"/>
    </linearGradient>
    <linearGradient id="tear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF9FF"/>
      <stop offset=".55" stop-color="#8FD3F6"/>
      <stop offset="1" stop-color="#4FAEE6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="bibClip">
      <path d="M186 412 C214 438 320 438 350 412 C370 450 384 482 388 512 L178 512 C182 482 186 452 186 412 Z"/>
    </clipPath>
    <clipPath id="haloClip">
      <circle cx="256" cy="250" r="192"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="5"/>
  <g id="art">
    <circle cx="256" cy="250" r="192" fill="url(#halo)"/>
    <g clip-path="url(#haloClip)">
      <ellipse cx="256" cy="430" rx="230" ry="120" fill="#F39A33" opacity=".55"/>
      <ellipse cx="256" cy="470" rx="250" ry="110" fill="#ED8926" opacity=".5"/>
    </g>
    <circle cx="256" cy="250" r="192" fill="none" stroke="#FFF0C8" stroke-opacity=".28" stroke-width="3"/>
    <ellipse cx="256" cy="372" rx="150" ry="62" fill="#D17F26" opacity=".30" filter="url(#soft)"/>

    <!-- ears -->
    <ellipse cx="138" cy="274" rx="19" ry="26" transform="rotate(-8 138 274)" fill="#472817"/>
    <ellipse cx="374" cy="274" rx="19" ry="26" transform="rotate(8 374 274)" fill="#472817"/>

    <!-- head -->
    <path d="M256 112 C194 112 150 150 142 212 C134 266 142 318 168 356 C188 386 220 404 256 404 C292 404 324 386 344 356 C370 318 378 266 370 212 C362 150 318 112 256 112 Z" fill="url(#skin)"/>
    <ellipse cx="204" cy="188" rx="50" ry="32" fill="#DDA87F" opacity=".09" transform="rotate(-14 204 188)"/>

    <!-- hair: small curled fringe -->
    <path d="M218 142 C208 128 212 110 226 104 C228 90 244 84 254 94 C264 82 282 86 286 100 C300 102 306 116 296 128 C284 140 264 142 250 134 C238 128 226 134 218 142 Z" fill="url(#hair)"/>
    <path d="M224 118 C226 106 234 100 244 102" stroke="#8E5F3D" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M252 104 C254 94 264 90 272 94" stroke="#8E5F3D" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M284 108 C290 100 298 102 300 110" stroke="#8E5F3D" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>

    <!-- worried brows -->
    <path d="M176 244 C194 230 216 224 235 224" stroke="#150A05" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M277 224 C296 224 318 230 336 244" stroke="#150A05" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M249 210 L251 222" stroke="#150A05" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
    <path d="M263 210 L261 222" stroke="#150A05" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>

    <!-- closed, crying eyes -->
    <path d="M184 256 C199 278 222 280 238 260" stroke="#150A05" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M274 260 C290 280 313 278 328 256" stroke="#150A05" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M182 250 L173 244" stroke="#150A05" stroke-width="5" stroke-linecap="round"/>
    <path d="M330 250 L339 244" stroke="#150A05" stroke-width="5" stroke-linecap="round"/>

    <!-- cheeks -->
    <ellipse cx="180" cy="314" rx="26" ry="15" fill="#C06046" opacity=".5"/>
    <ellipse cx="332" cy="314" rx="26" ry="15" fill="#C06046" opacity=".5"/>
    <ellipse cx="174" cy="309" rx="10" ry="5.5" fill="#E79C7D" opacity=".35"/>
    <ellipse cx="326" cy="309" rx="10" ry="5.5" fill="#E79C7D" opacity=".35"/>

    <!-- nose -->
    <path d="M240 290 C240 282 272 282 272 290 C272 302 264 309 256 309 C248 309 240 302 240 290 Z" fill="#29140B"/>
    <path d="M245 290 C249 284 263 284 267 290" stroke="#93603F" stroke-width="4" fill="none" stroke-linecap="round" opacity=".75"/>
    <ellipse cx="248" cy="301" rx="3.6" ry="2.6" fill="#100703"/>
    <ellipse cx="264" cy="301" rx="3.6" ry="2.6" fill="#100703"/>
    <path d="M256 308 L256 314" stroke="#2A150C" stroke-width="4" stroke-linecap="round" opacity=".5"/>

    <!-- wailing mouth -->
    <path d="M204 319 C222 305 290 305 308 319 C315 349 299 379 256 384 C213 379 197 349 204 319 Z" fill="#531528"/>
    <path d="M211 323 C229 313 283 313 301 323" stroke="#2C0913" stroke-width="10" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M224 359 C241 348 271 348 288 359 C282 378 230 378 224 359 Z" fill="#D4767C"/>
    <path d="M239 366 C250 372 262 372 273 366" stroke="#EDA3A8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M204 319 C222 305 290 305 308 319 C315 349 299 379 256 384 C213 379 197 349 204 319 Z" fill="none" stroke="#150A05" stroke-width="5" stroke-linejoin="round"/>
    <path d="M236 394 C245 398 267 398 276 394" stroke="#2A150C" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>

    <!-- tears -->
    <g>
      <path d="M176 284 C176 284 166 301 166 310 A10 10 0 0 0 186 310 C186 301 176 284 176 284 Z" fill="url(#tear)"/>
      <ellipse cx="172" cy="307" rx="2.6" ry="4.4" fill="#FFFFFF" opacity=".8"/>
      <path d="M336 284 C336 284 326 301 326 310 A10 10 0 0 0 346 310 C346 301 336 284 336 284 Z" fill="url(#tear)"/>
      <ellipse cx="332" cy="307" rx="2.6" ry="4.4" fill="#FFFFFF" opacity=".8"/>
      <path d="M150 240 C150 240 145 249 145 254 A5.5 5.5 0 0 0 156 254 C156 249 150 240 150 240 Z" fill="url(#tear)"/>
      <path d="M362 238 C362 238 357 247 357 252 A5.5 5.5 0 0 0 368 252 C368 247 362 238 362 238 Z" fill="url(#tear)"/>
      <path d="M352 330 C352 330 348 337 348 341 A5 5 0 0 0 358 341 C358 337 352 330 352 330 Z" fill="url(#tear)" opacity=".9"/>
    </g>

    <!-- bib -->
    <ellipse cx="270" cy="420" rx="80" ry="15" fill="#1B5C96" opacity=".20" filter="url(#soft)"/>
    <path d="M186 412 C214 438 320 438 350 412 C370 450 384 482 388 512 L178 512 C182 482 186 452 186 412 Z" fill="#F4FBFF"/>
    <g clip-path="url(#bibClip)" stroke="#CFEBFB" stroke-width="15" fill="none">
      <path d="M148 416 L272 540"/>
      <path d="M194 410 L318 534"/>
      <path d="M240 406 L364 530"/>
      <path d="M286 404 L410 528"/>
      <path d="M332 404 L456 528"/>
    </g>
    <path d="M186 412 C214 438 320 438 350 412 C370 450 384 482 388 512 L178 512 C182 482 186 452 186 412 Z" fill="none" stroke="#2C78BC" stroke-width="6" stroke-linejoin="round"/>
    <path d="M198 414 C226 444 312 444 340 414" stroke="#8FD0F4" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M198 414 C226 444 312 444 340 414" stroke="#5AA8DC" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".55"/>

    <!-- moon: outer arc left, inner arc carves the opening -->
    <path d="M148 402 A 53 53 0 1 0 148 486 Q 52 444 148 402 Z" fill="#FFFFFF"/>
    <path d="M158 410 Q161 424 174 427 Q161 430 158 444 Q155 430 142 427 Q155 424 158 410 Z" fill="#EAF7FF"/>
    <path d="M176 438 Q178 446 186 448 Q178 450 176 458 Q174 450 166 448 Q174 446 176 438 Z" fill="#D9EFFF"/>

    <!-- sound -->
    <g fill="none" stroke="#BCE4FA" stroke-linecap="round">
      <path d="M404 426 A22 22 0 0 1 404 470" stroke-width="7"/>
      <path d="M417 413 A37 37 0 0 1 417 483" stroke-width="7" opacity=".82"/>
      <path d="M430 400 A52 52 0 0 1 430 496" stroke-width="7" opacity=".64"/>
    </g>
  </g>

</svg>
